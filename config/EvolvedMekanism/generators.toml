#Generator production multipliers. This config is synced from server to client.
#Each value multiplies the matching Mekanism Generators rate, so Mekanism's own generator config still applies.
#Solar and lunar tiers multiply advancedSolarGeneration. The basic lunar multiblock uses that same rate at multiplier 1.
#Wind tiers multiply the height-based output between generationMin and generationMax.
#Internal buffer scales with the same multiplier. Defaults go up by x4 each tier, starting at x8 of the Mekanism generator used in the recipe.
[generators]

	#Evolved solar generators. Multiplier of Mekanism's advancedSolarGeneration.
	[generators.solar]
		#Production multiplier for the advanced tier.
		# Default: 8
		# Range: > 1
		advanced = 8
		#Production multiplier for the elite tier.
		# Default: 32
		# Range: > 1
		elite = 32
		#Production multiplier for the ultimate tier.
		# Default: 128
		# Range: > 1
		ultimate = 128
		#Production multiplier for the overclocked tier.
		# Default: 512
		# Range: > 1
		overclocked = 512
		#Production multiplier for the quantum tier.
		# Default: 2048
		# Range: > 1
		quantum = 2048
		#Production multiplier for the dense tier.
		# Default: 8192
		# Range: > 1
		dense = 8192
		#Production multiplier for the multiversal tier.
		# Default: 32768
		# Range: > 1
		multiversal = 32768
		#Production multiplier for the creative tier.
		# Default: 131072
		# Range: > 1
		creative = 131072

	#Lunar generators. Tiered machines multiply Mekanism's advancedSolarGeneration. The single-block lunar generator keeps using solarGeneration.
	[generators.lunar]
		#Production multiplier for the basic tier.
		# Default: 1
		# Range: > 1
		basic = 1
		#Production multiplier for the advanced tier.
		# Default: 8
		# Range: > 1
		advanced = 8
		#Production multiplier for the elite tier.
		# Default: 32
		# Range: > 1
		elite = 32
		#Production multiplier for the ultimate tier.
		# Default: 128
		# Range: > 1
		ultimate = 128
		#Production multiplier for the overclocked tier.
		# Default: 512
		# Range: > 1
		overclocked = 512
		#Production multiplier for the quantum tier.
		# Default: 2048
		# Range: > 1
		quantum = 2048
		#Production multiplier for the dense tier.
		# Default: 8192
		# Range: > 1
		dense = 8192
		#Production multiplier for the multiversal tier.
		# Default: 32768
		# Range: > 1
		multiversal = 32768
		#Production multiplier for the creative tier.
		# Default: 131072
		# Range: > 1
		creative = 131072

	#Evolved wind generators. Multiplier of Mekanism's height-based wind output.
	[generators.wind]
		#Production multiplier for the advanced tier.
		# Default: 8
		# Range: > 1
		advanced = 8
		#Production multiplier for the elite tier.
		# Default: 32
		# Range: > 1
		elite = 32
		#Production multiplier for the ultimate tier.
		# Default: 128
		# Range: > 1
		ultimate = 128
		#Production multiplier for the overclocked tier.
		# Default: 512
		# Range: > 1
		overclocked = 512
		#Production multiplier for the quantum tier.
		# Default: 2048
		# Range: > 1
		quantum = 2048
		#Production multiplier for the dense tier.
		# Default: 8192
		# Range: > 1
		dense = 8192
		#Production multiplier for the multiversal tier.
		# Default: 32768
		# Range: > 1
		multiversal = 32768
		#Production multiplier for the creative tier.
		# Default: 131072
		# Range: > 1
		creative = 131072
