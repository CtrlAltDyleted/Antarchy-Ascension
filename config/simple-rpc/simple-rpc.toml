# Antarchy - Ascension Simple Discord RPC configuration
# Simple RPC 4.x

[general]
	applicationID = "1550345490053472327"
	enabled = true
	debugging = false
	launcherIntegration = false
	rpcImageServer = false
	rpcImageServerUrl = "https://rpcavatar.firstdark.dev"
	version = 27

# Game loading
[init]
	enabled = true

	[[init.presence]]
		type = "PLAYING"
		description = "Launching Antarchy - Ascension"
		state = "Loading {{game.mods}} mods"
		largeImageKey = ["antarchy_ascension_title"]
		largeImageText = "Antarchy - Ascension"
		smallImageKey = ["{{images.player}}"]
		smallImageText = "{{player.name}}"
		streamingActivityUrl = ""

		[[init.presence.buttons]]
			label = "Join the Discord"
			url = "https://discord.gg/vfJQjDusZF"

		[[init.presence.buttons]]
			label = "View on CurseForge"
			url = "https://www.curseforge.com/minecraft/modpacks/antarchy-ascension"

# Main menu
[main_menu]
	enabled = true

	[[main_menu.presence]]
		type = "PLAYING"
		description = "At the Main Menu"
		state = "Preparing to Ascend"
		largeImageKey = ["antarchy_ascension_title"]
		largeImageText = "Antarchy - Ascension"
		smallImageKey = ["{{images.player}}"]
		smallImageText = "{{player.name}}"
		streamingActivityUrl = ""

