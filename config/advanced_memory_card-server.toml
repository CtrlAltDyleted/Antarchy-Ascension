#Advanced Memory Card - 服务端配置
[server]
	#复制模式下允许的最大方块数量（体积），默认 2048
	#Maximum number of blocks (volume) allowed in Copy Mode. Default: 2048.
	# Default: 2048
	# Range: > 1
	maxCopyVolume = 2048
	#高亮 P2P 设备时是否在聊天栏发送位置信息和传送链接
	#Set to false to disable chat messages when highlighting a P2P device.
	sendHighlightToChat = true
