#Maximum Build/Exchange range for the Builder's Multitool. Native Building Gadgets 2 gadgets keep their own range limit.
#0 follows multitoolRangeMultiplier; positive values override the Build/Exchange cap.
# Default: 0
# Range: 0 ~ 64
multitoolMaxRange = 0
#Multitool range multiplier for targeting (all profiles), Build To Me, Build/Exchange and destruction dimensions. Template size and transfer limits are separate.
# Default: 2.0
# Range: 1.0 ~ 4.0
multitoolRangeMultiplier = 2.0
#Emit detailed, rate-limited Builder's Multitool diagnostic instrumentation. Disabled by default.
debugInstrumentation = false
