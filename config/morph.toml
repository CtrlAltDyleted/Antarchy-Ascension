[biomass]
	#Enable the Biomass ability without requiring the advancement to unlock it?
	biomassBypassAdvancement = false
	#How much of the entity volume is considered their mass.
	biomassValue = 0.3

[morphMode]
	#Allows the selector to be used in COMMAND_ONLY mode. This lets the player morph freely from morphs that have been given to them.
	commandAllowSelector = false
	#Upgrades traits to the highest upgrade available for the morph. This, for example, will convert the bat's flapping flight ability to creative-mode flight ability.
	classicUpgradeTraits = false
	#Advancement ID that unlocks trait upgrades for a player (for example creative flight replacing flapping flight). Leave empty to only use the setting above.
	classicUpgradeTraitsAdvancement = ""
	#Traits that stay inactive until the player has an advancement. Format: <trait type>=<advancement ID>, e.g. "traitHostile=dog:slayer_of_god". A single trait in mob data can also set "requiresAdvancement".
	traitUnlockAdvancements = []

[playerFilter]
	#Name of players in the filter list.
	selectorFilterNames = []
	#Toggle between an allow-list or deny-list for biomass.
	biomassFilterType = "DENY"
	#Toggle between an allow-list or deny-list for morphing.
	morphFilterType = "DENY"
	#Toggle between an allow-list or deny-list for the morph selector.
	selectorFilterType = "DENY"
	#Name of players in the filter list.
	biomassFilterNames = []
	#Name of players in the filter list.
	morphFilterNames = []

[morph]
	#Set the morph entity instance to silent, this disables ambient noise and any sound the morph makes.
	silentMorphs = false
	#Time (in ticks) for a morph to complete.
	morphTime = 100
	#Morph normally only recalculates size when it has to. This makes Morph recalculate the player size every tick whilst morphed.
	aggressiveSizeRecalculation = false
	#ID of traits you want to disable.
	disabledTraits = []
	#Should the player's max health scale with the morph?
	healthScale = true
	#Which attributes are supported by more, and how are values better. Format: <Resource Name of Attribute>;<more/less>;[cap]. EG: "minecraft:generic.attack_damage;more" or "minecraft:generic.max_health;more;20".
	supportedAttributes = ["minecraft:generic.max_health;more", "minecraft:generic.knockback_resistance;more", "minecraft:generic.movement_speed;more;0.1", "minecraft:generic.attack_damage;more", "minecraft:generic.attack_knockback;more", "minecraft:generic.attack_speed;more", "minecraft:generic.armor;more", "minecraft:generic.luck;more", "minecraft:horse.jump_strength;more", "neoforge:swim_speed;more", "neoforge:reach_distance;more"]
	#How much of a morph's extra health you get (above your normal max health). 1.0 = full mob health, 0.25 = a quarter of the bonus. Morphs with less health than you still lower your health in full.
	healthMultiplier = 0.25
	#The highest max health a morph can give you (20 = 10 hearts). Set to 0 for no cap.
	maxMorphHealth = 60.0
	#How much of a morph's extra attack damage you get. Weaker morphs still lower your damage in full.
	attackDamageMultiplier = 0.5
	#The highest attack damage a morph can give you. Set to 0 for no cap.
	maxMorphAttackDamage = 10.0
	#How much of a morph's armor you get. Weaker morphs still lower your armor in full.
	armorMultiplier = 0.5
	#The highest armor a morph can give you. Set to 0 for no cap.
	maxMorphArmor = 10.0
	#Lets mob data set exact attribute values (attributeOverrides) while morphed, e.g. boss morphs. These ignore the multipliers and caps above, except armor, which still uses the armor multiplier and cap.
	enableAttributeOverrides = true
	#Scales how far attribute overrides move your stats from your normal values. 1.0 = the exact override value, 0.5 = halfway, 0 = no change.
	attributeOverrideMultiplier = 1.0
	#Default number of body segments for segmented morphs (like the Devourer of Gods) when their mob data doesn't set a count.
	morphSegmentCount = 102
	#Minimum seconds between morph idle sounds. Longer natural mob intervals are preserved. Default: 30 seconds.
	morphAmbientSoundInterval = 30
	#Volume multiplier for morph idle sounds, capped before scaling so loud mobs cannot overwhelm you. Set to 0 to mute idle sounds. Default: 0.2.
	morphAmbientSoundVolume = 0.2
	#Where a morph's stats are read from when it's acquired. LIVE: the killed mob as it was (includes buffs and spawn scaling). FRESH: a new, unspawned copy of the mob. TYPE_DEFAULT: the entity type's registered default attributes.
	attributeSource = "LIVE"
	#If off, a morph never changes your attack damage. Abilities that scale with attack damage still use the morph's own value.
	morphsAffectAttackDamage = true

[gameplay]
	#The Biomass Skin is meant to show during invisibility. Turning this off disables that.
	biomassSkinWhilstInvisible = true
	#The mode the mod runs in. Accepts CLASSIC, COMMAND_ONLY, DISGUISE.
	#
	#CLASSIC: Old Morph as we know and love: Kill a mob, acquire it.
	#COMMAND_ONLY: Players can only acquire morphs or morph when the /morph command is used by ops.
	#DISGUISE: Killing a mob morphs you into the mob you just killed.
	#DEFAULT: Disabled until it has been finished.
	morphMode = "CLASSIC"
	#Resource Location name for Mob types you cannot acquire biomass or morphs from. Uses Regex matching.
	disabledMobs = ["minecraft:armor_stand"]
	#If you die while morphed, you go back to player form and lose the morph you were in. The rest of your collection is kept.
	loseMorphOnDeath = false
	#Lets a Snatcher morph pickpocket a random hotbar item from other players.
	snatcherStealFromPlayers = true
	#Lets an Eater morph's Terror Roar give Fear to other players, not just mobs.
	eaterRoarAffectsPlayers = true
	#If Witchery is installed, a player morphed as a Werewolf infects other players with lycanthropy when their Bite ability hits.
	werewolfMorphBiteInfects = false
	#Disable Better Combat attacks and animations while morphed. When disabled, Better Combat remains active and Morph replaces the visible player hands with the morph's hands.
	disableBetterCombatForMorphs = false
