#This category is for config options that affect the capabilities of the Gravity Gun and is synched to all clients from the server.
[capabilities]
	#Server dependant.
	#Joining servers with this config disabled will disable the recipe.
	enableSuperchargedRecipe = true
	#List of blacklisted blocks, by resource name. Eg: modname:blockname
	blacklistBlocks = []
	#Convert the blacklist into a whitelist.
	whitelistBlocks = false
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 2
	# Range: 0 ~ 2
	capabilitiesPullBosses = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 1
	# Range: 0 ~ 2
	capabilitiesPullPlayer = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 0
	# Range: 0 ~ 2
	capabilitiesPullEntity = 0
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 1
	# Range: 0 ~ 2
	capabilitiesPullBlock = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 1
	# Range: 0 ~ 2
	capabilitiesPullTileEntity = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 2
	# Range: 0 ~ 2
	capabilitiesGrabBosses = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 1
	# Range: 0 ~ 2
	capabilitiesGrabPlayer = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 0
	# Range: 0 ~ 2
	capabilitiesGrabEntity = 0
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 0
	# Range: 0 ~ 2
	capabilitiesGrabBlock = 0
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 1
	# Range: 0 ~ 2
	capabilitiesGrabTileEntity = 1
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 0
	# Range: 0 ~ 2
	capabilitiesGrabDistanceAdjust = 0
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 0
	# Range: 0 ~ 2
	capabilitiesPushEntity = 0
	#Maximum distance for the Gravity Gun's pull
	# Default: 10
	# Range: 5 ~ 100
	pullDistance = 10
	#Amplification Factor of the Supercharged Gravity Gun, in percentage.
	# Default: 150
	# Range: 100 ~ 1000000
	superchargedAmplifyFactorPull = 150
	#Amplification Factor of the Supercharged Gravity Gun, in percentage, for weight of entity.
	# Default: 200
	# Range: 100 ~ 1000000
	superchargedAmplifyFactorGrab = 200
	#Amplification Factor of the Supercharged Gravity Gun, in percentage, for distance of entity.
	# Default: 300
	# Range: 100 ~ 1000000
	superchargedAmplifyFactorGrabDistance = 300
	#Maximum weight (where weight is the cube root of the entity's volume) / 100.
	#Set to 0 to disable weightage
	#EG: To find the level of a spider, (1.4 * 1.4 * 0.9)^(1/3) * 100, rounded off to an integer.
	# Default: 150
	# Range: 0 ~ 1000000
	entityGrabMaxWeight = 150
	#Push factor of the Gravity Gun
	# Default: 10
	# Range: 5 ~ 100
	pushFactor = 10
	#Amplification Factor of the Supercharged Gravity Gun, in percentage.
	# Default: 130
	# Range: 100 ~ 1000000
	superchargedAmplifyFactorPush = 130
	#Levels for Gravity Gun capabilities.
	#0 = All Gravity Guns
	#1 = Supercharged only
	#2 = Off
	# Default: 1
	# Range: 0 ~ 2
	capabilityCreeperDetonation = 1
